name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

jobs:
  node-ci:
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-node-ci.yml@62e48ea24d6b7b8fe4cf7cc6f139ac168f213e99 # v1.3.21
    with:
      node-version: "24.19.0"
      run-build: false
      test-docker: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
